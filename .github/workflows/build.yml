name: Build Fabric Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Unzip Archive
        run: unzip -o *.zip -d .

      - name: Fix Repositories and Settings
        run: |
          echo "pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "rootProject.name = 'ft-helper'" >> settings.gradle
          echo "repositories { maven { url = 'https://maven.fabricmc.net/' } }" >> build.gradle

      - name: Build Mod
        run: gradle build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTHelper-Jar
          path: build/libs/*.jar
          
