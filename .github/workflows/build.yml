name: Build Fabric Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract And Build Mod
        run: |
          # Распаковываем самый свежий zip
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          unzip -o "$LATEST_ZIP" -d extracted
          
          # Находим, в какой именно папке спрятан код
          MOD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$MOD_DIR"
          
          # Добавляем настройки репозиториев
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ft-helper'
          EOF
          
          # Собираем мод
          gradle build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTHelper-Jar
          path: '**/build/libs/*.jar'
          
