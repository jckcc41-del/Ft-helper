name: Build Ft-helper

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build Mod
        run: gradle build remapJar --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: ls -la build/libs || echo "no build/libs"

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: FTHelper-Jar
          path: build/libs/*.jar
          if-no-files-found: error
