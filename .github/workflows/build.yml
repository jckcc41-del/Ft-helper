name: Build Fabric Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Project Files
        run: |
          rm -rf src build.gradle settings.gradle
          mkdir -p src/main/java/com/ft/helper
          mkdir -p src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ft-helper'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.9'
              id 'maven-publish'
          }

          version = '2.0.0-1.21.4'
          group = 'com.ft.helper'

          base {
              archivesName = 'FTHelper-GUI-FunTime-1.21.4'
          }

          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.4"
              mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.114.0+1.21.4"
          }

          processResources {
              inputs.property "version", project.version
              filteringCharset "UTF-8"

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "ft-helper",
            "version": "2.0.0-1.21.4",
            "name": "FT Helper GUI",
            "description": "Auto-swap utility items for FunTime",
            "authors": ["Winnexxx"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.ft.helper.FTHelperClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.4",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ft/helper/FTHelperClient.java
          package com.ft.helper;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.item.ItemStack;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.text.Text;
          import net.minecraft.util.Hand;
          import org.lwjgl.glfw.GLFW;

          public class FTHelperClient implements ClientModInitializer {

              public static final String KEY_CATEGORY = "category.ft-helper";

              public enum SpecialItem {
                  DESORIENT("D", "Дезориентация", new String[]{"дезор", "дезориент"}, GLFW.GLFW_KEY_D),
                  YAVNAYA_DUST("Y", "Явная пыль", new String[]{"явная", "пыль"}, GLFW.GLFW_KEY_Y),
                  TRAP("T", "Трапка", new String[]{"трап", "ловушк"}, GLFW.GLFW_KEY_T),
                  PLAST("P", "Пласт", new String[]{"пласт"}, GLFW.GLFW_KEY_P),
                  FIRE_TORNADO("F", "Огненный смерч", new String[]{"смерч", "огнен"}, GLFW.GLFW_KEY_F),
                  FREEZE_SNOW("S", "Снежок-заморозка", new String[]{"замороз", "снежок"}, GLFW.GLFW_KEY_S),
                  GOD_AURA("G", "Божья аура", new String[]{"аура", "бож"}, GLFW.GLFW_KEY_G);

                  private final String codeLetter;
                  private final String fullName;
                  private final String[] keywords;
                  private int boundKey;

                  SpecialItem(String codeLetter, String fullName, String[] keywords, int defaultKey) {
                      this.codeLetter = codeLetter;
                      this.fullName = fullName;
                      this.keywords = keywords;
                      this.boundKey = defaultKey;
                  }

                  public String getCodeLetter() { return codeLetter; }
                  public String getFullName() { return fullName; }
                  public String[] getKeywords() { return keywords; }
                  public int getBoundKey() { return boundKey; }
                  public void setBoundKey(int boundKey) { this.boundKey = boundKey; }
              }

              public static KeyBinding openGuiKey;

              @Override
              public void onInitializeClient() {
                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.ft-helper.open_gui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_INSERT,
                          KEY_CATEGORY
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.world == null) return;

                      while (openGuiKey.wasPressed()) {
                          client.setScreen(new FTHelperScreen(client.currentScreen));
                      }

                      if (client.currentScreen == null) {
                          for (SpecialItem item : SpecialItem.values()) {
                              if (item.getBoundKey() != GLFW.GLFW_KEY_UNKNOWN) {
                                  if (InputUtil.isKeyPressed(client.getWindow().getHandle(), item.getBoundKey())) {
                                      useSpecialItem(client, item);
                                  }
                              }
                          }
                      }
                  });
              }

              private static long lastUseTime = 0;

              public static void useSpecialItem(MinecraftClient client, SpecialItem item) {
                  if (client.player == null || client.interactionManager == null) return;

                  long now = System.currentTimeMillis();
                  if (now - lastUseTime < 250) return;
                  lastUseTime = now;

                  int originalSlot = client.player.getInventory().selectedSlot;

                  int hotbarSlot = findInHotbar(client, item.getKeywords());
                  if (hotbarSlot != -1) {
                      client.player.getInventory().selectedSlot = hotbarSlot;
                      client.interactionManager.interactItem(client.player, Hand.MAIN_HAND);
                      client.player.sendMessage(Text.literal("§a[FT Helper] Использован: §e" + item.getFullName()), true);
                      return;
                  }

                  int invSlot = findInInventory(client, item.getKeywords());
                  if (invSlot != -1) {
                      int syncId = client.player.currentScreenHandler.syncId;

                      client.interactionManager.clickSlot(
                              syncId,
                              invSlot,
                              originalSlot,
                              SlotActionType.SWAP,
                              client.player
                      );

                      client.interactionManager.interactItem(client.player, Hand.MAIN_HAND);
                      client.player.sendMessage(Text.literal("§a[FT Helper] Свапнут и использован: §e" + item.getFullName()), true);
                  } else {
                      client.player.sendMessage(Text.literal("§c[FT Helper] §e" + item.getFullName() + " §cне найден!"), true);
                  }
              }

              private static int findInHotbar(MinecraftClient client, String[] keywords) {
                  for (int i = 0; i < 9; i++) {
                      ItemStack stack = client.player.getInventory().getStack(i);
                      if (isMatching(stack, keywords)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private static int findInInventory(MinecraftClient client, String[] keywords) {
                  for (int i = 9; i < 36; i++) {
                      ItemStack stack = client.player.getInventory().getStack(i);
                      if (isMatching(stack, keywords)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private static boolean isMatching(ItemStack stack, String[] keywords) {
                  if (stack.isEmpty()) return false;
                  String name = stack.getName().getString().toLowerCase();
                  for (String kw : keywords) {
                      if (name.contains(kw.toLowerCase())) return true;
                  }
                  return false;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ft/helper/FTHelperScreen.java
          package com.ft.helper;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.HashMap;
          import java.util.Map;

          public class FTHelperScreen extends Screen {

              private final Screen parent;
              private FTHelperClient.SpecialItem listeningItem = null;
              private final Map<FTHelperClient.SpecialItem, ButtonWidget> bindButtons = new HashMap<>();

              public FTHelperScreen(Screen parent) {
                  super(Text.literal("FT Helper - Настройка спец-предметов"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int startY = 50;
                  int spacing = 24;
                  int index = 0;
                  int centerX = this.width / 2;

                  for (FTHelperClient.SpecialItem item : FTHelperClient.SpecialItem.values()) {
                      int currentY = startY + (index * spacing);
                      final FTHelperClient.SpecialItem currentItem = item;

                      String keyText = getKeyName(item.getBoundKey());
                      ButtonWidget btn = ButtonWidget.builder(Text.literal(keyText), button -> {
                          listeningItem = currentItem;
                          button.setMessage(Text.literal("> ... <"));
                      }).dimensions(centerX + 60, currentY, 70, 20).build();

                      bindButtons.put(item, btn);
                      this.addDrawableChild(btn);

                      index++;
                  }

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Готово"), button -> {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }).dimensions(centerX - 50, startY + (index * spacing) + 10, 100, 20).build());
              }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (listeningItem != null) {
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_BACKSPACE) {
                          listeningItem.setBoundKey(GLFW.GLFW_KEY_UNKNOWN);
                      } else {
                          listeningItem.setBoundKey(keyCode);
                      }

                      ButtonWidget btn = bindButtons.get(listeningItem);
                      if (btn != null) {
                          btn.setMessage(Text.literal(getKeyName(listeningItem.getBoundKey())));
                      }

                      listeningItem = null;
                      return true;
                  }

                  return super.keyPressed(keyCode, scanCode, modifiers);
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);
                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 20, 0xFFFFFF);

                  int startY = 50;
                  int spacing = 24;
                  int index = 0;
                  int centerX = this.width / 2;

                  for (FTHelperClient.SpecialItem item : FTHelperClient.SpecialItem.values()) {
                      int currentY = startY + (index * spacing) + 5;
                      String label = "§e[" + item.getCodeLetter() + "] §f" + item.getFullName();
                      context.drawTextWithShadow(this.textRenderer, Text.literal(label), centerX - 130, currentY, 0xFFFFFF);
                      index++;
                  }
              }

              private String getKeyName(int keyCode) {
                  if (keyCode == GLFW.GLFW_KEY_UNKNOWN) return "NONE";
                  return InputUtil.Type.KEYSYM.createFromCode(keyCode).getLocalizedText().getString().toUpperCase();
              }

              @Override
              public void close() {
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }
          }
          EOF

      - name: Build Mod
        run: gradle build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTHelper-Jar
          path: build/libs/*.jar
          
