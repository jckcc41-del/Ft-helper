name: Build Ft-helper

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Diagnose archive
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== ZIP files ==="
          ls -la *.zip || echo "NO ZIP FOUND"

      - name: Unzip Latest Archive
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$LATEST_ZIP" ]; then
            echo "::error::No .zip file in repository root"
            exit 1
          fi
          echo "Unzipping $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d extracted
          echo "=== Extracted tree ==="
          find extracted -maxdepth 3 -type f | head -n 60

      - name: Find project root
        id: findroot
        run: |
          if [ -f extracted/build.gradle ] || [ -f extracted/build.gradle.kts ]; then
            echo "dir=extracted" >> $GITHUB_OUTPUT
          elif [ -f extracted/*/build.gradle ] || [ -f extracted/*/build.gradle.kts ]; then
            SUB=$(ls -d extracted/*/ | head -n 1)
            echo "dir=$SUB" >> $GITHUB_OUTPUT
          else
            echo "::error::build.gradle not found in archive"
            find extracted -type f | head -n 60
            exit 1
          fi

      - name: Show project layout
        run: |
          echo "Project dir: ${{ steps.findroot.outputs.dir }}"
          ls -la "${{ steps.findroot.outputs.dir }}"
          echo "=== gradle.properties ==="
          cat "${{ steps.findroot.outputs.dir }}/gradle.properties" || true
          echo "=== settings.gradle(.kts) ==="
          cat "${{ steps.findroot.outputs.dir }}/settings.gradle" 2>/dev/null || cat "${{ steps.findroot.outputs.dir }}/settings.gradle.kts" 2>/dev/null || echo "no settings file"

      - name: Ensure settings.gradle
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ft-helper'
          EOF
          fi

      - name: Make gradlew executable
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build Mod (capture log)
        id: build
        working-directory: ${{ steps.findroot.outputs.dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build remapJar --no-daemon --stacktrace --info 2>&1 | tee ../build.log
          echo "EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Build outputs
        if: always()
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: |
          echo "=== build/ tree ==="
          find build -type f 2>/dev/null | head -n 80 || echo "no build dir"
          echo "=== build/libs ==="
          ls -la build/libs 2>/dev/null || echo "no build/libs"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload JARs (if any)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FTHelper-Jar
          path: ${{ steps.findroot.outputs.dir }}/build/libs/*.jar
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outputs.EXIT != '0'
        run: |
          echo "::error::Gradle failed with exit code ${{ steps.build.outputs.EXIT }} — скачай артефакт 'build-log' и пришли мне"
          exit 1
