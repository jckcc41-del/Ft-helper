name: Build Ft-helper

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Unzip Latest Archive
        run: |
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Unzipping $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d .

      - name: Show project structure
        run: |
          echo "=== Top level ==="
          ls -la
          echo "=== Looking for build.gradle ==="
          find . -maxdepth 3 -name "build.gradle" -o -maxdepth 3 -name "build.gradle.kts"

      - name: Move into project dir if needed
        run: |
          if [ ! -f ./build.gradle ] && [ ! -f ./build.gradle.kts ]; then
            PROJECT_DIR=$(find . -maxdepth 2 -name "build.gradle" -o -maxdepth 2 -name "build.gradle.kts" | head -n 1 | xargs dirname)
            echo "Project found in: $PROJECT_DIR"
            shopt -s dotglob
            mv "$PROJECT_DIR"/* . 2>/dev/null || true
            rmdir "$PROJECT_DIR" 2>/dev/null || true
          fi
          ls -la

      - name: Ensure settings.gradle
        run: |
          if [ ! -f ./settings.gradle ] && [ ! -f ./settings.gradle.kts ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ft-helper'
          EOF
          fi

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build Mod
        run: gradle build remapJar --no-daemon --stacktrace

      - name: Show build outputs
        if: always()
        run: |
          echo "=== build/ tree ==="
          find build -type f 2>/dev/null | head -n 50 || echo "no build dir"
          echo "=== libs ==="
          ls -la build/libs/ 2>/dev/null || echo "no build/libs"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: FTHelper-Jar
          path: build/libs/*.jar
          if-no-files-found: error
